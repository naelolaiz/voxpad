[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxpad"
version = "0.1.0"
description = "Local audio and WhatsApp transcription powered by Whistle, with real-time cross-platform dictation planned."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
voxpad = "voxpad.whatsapp:cli"

[tool.setuptools.packages.find]
include = ["voxpad*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
