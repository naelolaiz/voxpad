[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxpad"
version = "0.1.0"
description = "Local audio and WhatsApp transcription powered by Whisper, with real-time cross-platform dictation planned."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
keywords = ["speech-to-text", "transcription", "whatsapp", "dictation"]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
voxpad = "voxpad.whatsapp:cli"

[project.gui-scripts]
voxpad-app = "voxpad.gui:main"

[tool.setuptools.packages.find]
include = ["voxpad*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Dependencies are read from requirements.txt, so uv must notice when it changes.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "requirements.txt" }]
