version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Leave new releases a week to be vetted before adopting them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      browser-app:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # tokenizers, which faster-whisper depends on, requires huggingface-hub below 2.0.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
