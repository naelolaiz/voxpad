name: Tests and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
        python: ["3.10", "3.14"]
        # The speech runtime has no Intel macOS build for Python 3.14.
        exclude:
          - os: macos-15-intel
            python: "3.14"
        include:
          - os: macos-15-intel
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install application and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install the system libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Run tests without downloading models
        run: python scripts/dev.py test

  package:
    name: Build wheel and source distribution
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install application and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build wheel and source distribution
        run: python scripts/dev.py build
      - name: Install source distribution and smoke-test its module CLIs
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise RuntimeError(f"Expected one source distribution, found: {archives}")
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(archives[0].resolve())],
              check=True,
          )
          with tempfile.TemporaryDirectory(prefix="voxpad-sdist-") as directory:
              subprocess.run([sys.executable, "-I", "-m", "voxpad", "--help"], cwd=directory, check=True)
              subprocess.run([sys.executable, "-I", "-m", "voxpad.stats", "--help"], cwd=directory, check=True)
              # The viewer's script and stylesheet are package data: a page can only be written if the archive carried them.
              chat = Path(directory) / "chat" / "chat.txt"
              chat.parent.mkdir()
              chat.write_text("13/01/26, 09:02 - Ana: Good morning\n13/01/26, 09:05 - Li: See you at noon\n", encoding="utf-8")
              completed = subprocess.run(
                  [sys.executable, "-I", "-m", "voxpad.stats", str(chat)], cwd=directory,
                  stdout=subprocess.PIPE, text=True, check=True,
              )
              page = (Path(directory) / "conversation.html").read_text(encoding="utf-8")
              if "Parsed 2 messages" not in completed.stdout or "mountViewer(" not in page or "Good morning" not in page:
                  raise RuntimeError(f"voxpad-stats did not write the viewer: {completed.stdout}")
              print(completed.stdout, end="")
      - name: Upload installable packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  install-wheel:
    name: Install wheel / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The speech runtime has no Intel macOS build for Python 3.14.
          python-version: ${{ matrix.os == 'macos-15-intel' && '3.13' || '3.14' }}
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install wheel and smoke-test the commands outside the source directory
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          wheels = list(Path("dist").glob("*-py3-none-any.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"Expected one universal Python wheel, found: {wheels}")
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheels[0].resolve())], check=True)
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
          command = shutil.which("voxpad")
          if command is None:
              raise RuntimeError("The installed wheel did not provide the voxpad command")
          with tempfile.TemporaryDirectory(prefix="voxpad-wheel-") as directory:
              subprocess.run([sys.executable, "-I", "-m", "voxpad", "--help"], cwd=directory, check=True)
              subprocess.run([command, "--help"], cwd=directory, check=True)
              # The desktop application's help needs no display.
              subprocess.run([sys.executable, "-I", "-m", "voxpad.gui", "--help"], cwd=directory, check=True)
              if shutil.which("voxpad-app") is None:
                  raise RuntimeError("The installed wheel did not provide the voxpad-app command")
              audio = Path(directory) / "voice.opus"
              audio.write_bytes(b"dry-run fixture; no decoding or inference")
              completed = subprocess.run(
                  [command, str(audio), "--dry-run"], cwd=directory,
                  capture_output=True, text=True, check=True,
              )
              if "voice.opus" not in completed.stdout:
                  raise RuntimeError(f"Dry-run did not discover the voice note: {completed.stdout}")
              print(completed.stdout, end="")
              stats = shutil.which("voxpad-stats")
              if stats is None:
                  raise RuntimeError("The installed wheel did not provide the voxpad-stats command")
              subprocess.run([sys.executable, "-I", "-m", "voxpad.stats", "--help"], cwd=directory, check=True)
              subprocess.run([stats, "--help"], cwd=directory, check=True)
              # The viewer's script and stylesheet are package data: a page can only be written if the wheel carried them.
              chat = Path(directory) / "chat" / "chat.txt"
              chat.parent.mkdir()
              chat.write_text("13/01/26, 09:02 - Ana: Good morning\n13/01/26, 09:05 - Li: See you at noon\n", encoding="utf-8")
              completed = subprocess.run([stats, str(chat)], cwd=directory, stdout=subprocess.PIPE, text=True, check=True)
              page = (Path(directory) / "conversation.html").read_text(encoding="utf-8")
              if "Parsed 2 messages" not in completed.stdout or "mountViewer(" not in page or "Good morning" not in page:
                  raise RuntimeError(f"voxpad-stats did not write the viewer: {completed.stdout}")
              print(completed.stdout, end="")

  web:
    name: Test and build browser app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser application dependencies
        run: npm ci
      # Restored after npm ci, which empties node_modules.
      - name: Cache the speech model used by browser tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules/.cache/whisper
          key: whisper-assets-${{ hashFiles('web/src/models.js', 'web/tests/browser/assets.js') }}
      - name: Run browser application unit tests
        run: npm test
      - name: Build browser application
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser
